name: Build, Test, and Push Docker Image

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install ffmpeg
      run: sudo apt-get install -y ffmpeg

    - name: Lint with ruff
      run: |
        # Blocking: syntax errors and undefined names
        ruff check . --select=E9,F63,F7,F82 --output-format=full
        # Non-blocking until the style guide backlog is cleaned up (see style guide, known deviations)
        ruff check . --exit-zero --statistics
        ruff format --check . || true

    - name: Prepare /data folder for tests
      run: |
        sudo mkdir -p /data
        sudo chmod 777 /data

    - name: Test with pytest
      run: |
        pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      run: |
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker buildx create --use

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Build and push Docker image
      run: |
        REPO_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        docker buildx build --platform linux/amd64,linux/arm64 -t ghcr.io/${REPO_NAME}:latest --push .